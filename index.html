<style>
:root{
  --bg:#E8EDEF; --surface:#FFFFFF; --soft:#F3F6F7; --ink:#17242A; --muted:#58676E; --line:#D0D9DD;
  --accent:#1D5A78; --accent-ink:#FFFFFF; --warn:#A8401A; --warn-bg:#F6E1D6; --ok:#2E6A4E;
  --c-versicherung:#2D6A8E; --c-energie:#B98317; --c-tele:#69498F; --c-abo:#AE416C;
  --c-mitglied:#3C7A4E; --c-kredit:#7B5939; --c-sonst:#69767E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11191D; --surface:#1A252A; --soft:#212E34; --ink:#E6EDEF; --muted:#9AAAB1; --line:#2E3D44;
    --accent:#6FB3D6; --accent-ink:#0E1A20; --warn:#F09A72; --warn-bg:#3A231A; --ok:#7CC49F;
    --c-versicherung:#5FA3CB; --c-energie:#E0AE45; --c-tele:#A688CF; --c-abo:#E07AA2;
    --c-mitglied:#76B887; --c-kredit:#C49A72; --c-sonst:#9AA6AD;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11191D; --surface:#1A252A; --soft:#212E34; --ink:#E6EDEF; --muted:#9AAAB1; --line:#2E3D44;
  --accent:#6FB3D6; --accent-ink:#0E1A20; --warn:#F09A72; --warn-bg:#3A231A; --ok:#7CC49F;
  --c-versicherung:#5FA3CB; --c-energie:#E0AE45; --c-tele:#A688CF; --c-abo:#E07AA2;
  --c-mitglied:#76B887; --c-kredit:#C49A72; --c-sonst:#9AA6AD;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:44px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 120px}

/* Kopf */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top h2{font-size:1.05rem;font-weight:700;color:var(--muted)}
.icon-btn{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.hero{margin:6px 0 22px}
.hero .lead{font-size:.95rem;color:var(--muted);margin:0 0 4px}
.hero h1{font-weight:700;letter-spacing:-.01em}
.hero h1 .name{display:block;width:100%;white-space:nowrap;font-size:40px;line-height:1.1}
.hero .when{margin:8px 0 0;color:var(--muted);font:500 1.2rem/1.3 "Bricolage Grotesque",system-ui,sans-serif}
.hero.urgent .when{color:var(--warn)}
.sum{display:flex;gap:28px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:18px}
.sum div{font-size:.9rem;color:var(--muted)}
.sum strong{display:block;font-size:1.3rem;color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}

/* Filter */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;scrollbar-width:none;touch-action:pan-x}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:16px}

/* Karten mit Registerreiter */
.list{display:flex;flex-direction:column;gap:30px;padding-top:24px}
.card{position:relative;display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:14px 16px;cursor:pointer;color:var(--ink)}
.card .tab{position:absolute;left:-1px;top:-21px;height:21px;padding:2px 12px 0;font-size:.75rem;font-weight:700;color:#fff;background:var(--cat);border-radius:8px 8px 0 0;white-space:nowrap}
.card.inactive{opacity:.6}
.row1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card h3{font-size:1.15rem;font-weight:700;overflow-wrap:anywhere;hyphens:auto}
.row2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:4px}
.row2 .sub{margin:0;flex:1;min-width:0}
.amount{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.amount small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.sub{margin:2px 0 0;color:var(--muted);font-size:.93rem}
.due{margin:10px 0 0;font-size:.93rem;padding-top:10px;border-top:1px dashed var(--line)}
.due.soon{color:var(--warn);font-weight:700}
.due.calm{color:var(--muted)}
.empty{padding:40px 0;text-align:left}
.empty p{color:var(--muted)}

.fab{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 22px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(10,30,40,.25);z-index:5}
.note{font-size:.85rem;color:var(--muted);margin:0 0 14px;padding:10px 12px;background:var(--soft);border-radius:10px}

/* Dialoge */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(640px,100%);max-height:92vh;border-radius:18px;overflow:hidden}
dialog{max-width:100vw;overflow-x:hidden;overscroll-behavior:contain}
dialog::backdrop{background:rgba(8,18,24,.5)}
.sheet-body{overflow-x:hidden;touch-action:pan-y}
.grid2 > *{min-width:0}
label > input,label > select,label > textarea{min-width:0;max-width:100%}
@media (max-width:640px){
  dialog{margin:auto 0 0;max-width:100%;border-radius:18px 18px 0 0;max-height:94vh}
}
.sheet{display:flex;flex-direction:column;max-height:inherit}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:1.25rem}
.sheet-body{overflow-y:auto;padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.close{background:none;border:0;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}

fieldset{border:0;padding:0;margin:0 0 22px}
legend{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.05rem;margin-bottom:10px;padding:0}
label{display:block;font-size:.88rem;color:var(--muted);margin:0 0 12px}
label > input,label > select,label > textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font-size:1rem}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:.82rem;color:var(--muted);margin:-6px 0 12px}
.members{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.members label{margin:0;display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink);cursor:pointer}
.members input{width:auto;margin:0;display:inline}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:700;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}

/* Detail */
.status-box{padding:14px;border-radius:12px;background:var(--soft);margin-bottom:18px}
.status-box.soon{background:var(--warn-bg)}
.status-box strong{display:block;font-size:1.1rem}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0 0 20px}
dt{color:var(--muted);font-size:.9rem}
dd{margin:0;overflow-wrap:anywhere}
dd a{color:var(--accent)}
.history{list-style:none;padding:0;margin:0 0 20px;border-left:2px solid var(--line)}
.history li{position:relative;padding:0 0 16px 16px}
.history li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.history li.current::before{background:var(--accent)}
.history .period{font-weight:700}
.history .meta{color:var(--muted);font-size:.9rem}
.up{color:var(--warn)} .downv{color:var(--ok)}
.settings-member{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.inline{display:flex;gap:8px}
.inline input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
@media (prefers-reduced-motion:no-preference){ .card{transition:transform .12s} .card:active{transform:scale(.99)} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h2>Haushaltsverträge</h2>
    <button class="icon-btn" id="btnSettings" aria-label="Einstellungen">Einstellungen</button>
  </div>
  <p class="note" id="storeNote" hidden></p>
  <section class="hero" id="hero"><p class="lead">Lade Verträge …</p></section>
  <div class="sum" id="sum" hidden></div>
  <input class="search" id="search" type="search" placeholder="Suchen nach Gegenstand, Anbieter, Nummer" aria-label="Suchen">
  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>
</div>
<button class="fab" id="btnNew">Vertrag hinzufügen</button>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>

<script>
(() => {
const KAT = [
  {k:'versicherung', n:'Versicherung'},
  {k:'energie', n:'Energie'},
  {k:'tele', n:'Telekommunikation'},
  {k:'abo', n:'Abo & Streaming'},
  {k:'mitglied', n:'Mitgliedschaft'},
  {k:'kredit', n:'Kredit & Finanzierung'},
  {k:'sonst', n:'Sonstiges'}
];
const katName = k => (KAT.find(x=>x.k===k)||KAT[6]).n;
const katColor = k => `var(--c-${KAT.some(x=>x.k===k)?k:'sonst'})`;
const ZW = {monatlich:['monatlich',12], quartal:['vierteljährlich',4], halbjahr:['halbjährlich',2], jahr:['jährlich',1]};
const EUR = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});

let settings = {mitglieder:[], vorlauf:30};
let vertraege = [];
let filter = 'alle', suche = '';

/* ---------- Datum ---------- */
const heute = () => { const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); };
const parse = s => { if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const iso = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : '';
const lastDay = (y,m) => new Date(y,m+1,0).getDate();
function addMonths(d,n){
  const y=d.getFullYear(), m=d.getMonth(), day=d.getDate();
  const eom = day===lastDay(y,m);
  const t = new Date(y,m+n,1);
  const ld = lastDay(t.getFullYear(),t.getMonth());
  t.setDate(eom ? ld : Math.min(day,ld));
  return t;
}
const addDays = (d,n) => { const t=new Date(d); t.setDate(t.getDate()+n); return t; };
function frist(d,v,sign){
  const n=(+v.fristWert||0)*sign;
  if(v.fristEinheit==='tage') return addDays(d,n);
  if(v.fristEinheit==='wochen') return addDays(d,7*n);
  return addMonths(d,n);
}
const verlMonate = v => v.verlEinheit==='keine' ? 0 : (+v.verlWert||0)*(v.verlEinheit==='jahre'?12:1);
const fmt = d => d ? d.toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'}) : '–';
const tageBis = d => Math.round((d - heute())/864e5);
const inTagen = n => n===0 ? 'heute' : n===1 ? 'morgen' : `in ${n} Tagen`;

/* ---------- Berechnung ---------- */
const aktuell = c => c.versionen[c.versionen.length-1];
function berechne(c){
  const v = aktuell(c), t = heute();
  if(c.status==='gekuendigt'){
    const z = parse(c.gekuendigtZum);
    return z && z < t ? {typ:'beendet', termin:z} : {typ:'gekuendigt', termin:z};
  }
  if(c.status==='beendet') return {typ:'beendet'};
  const ende = parse(v.ende);
  if(v.fristModus==='ablauf' || !v.fristModus){
    if(!ende) return {typ:'offen'};
    const vm = verlMonate(v);
    if(!vm) return ende >= t ? {typ:'endet', termin:ende} : {typ:'abgelaufen', termin:ende};
    for(let k=0;k<1200;k++){
      const termin = k ? addMonths(ende,k*vm) : ende;
      const bis = frist(termin,v,-1);
      if(bis >= t) return {typ:'termin', termin, bis};
      if(!vm) return termin >= t ? {typ:'endet', termin} : {typ:'abgelaufen', termin};
    }
    return {typ:'offen'};
  }
  if(ende){ const bis=frist(ende,v,-1); if(bis>=t) return {typ:'termin', termin:ende, bis}; }
  let termin = frist(t,v,1);
  if(v.fristModus==='monatsende') termin = new Date(termin.getFullYear(), termin.getMonth()+1, 0);
  return {typ:'jederzeit', termin};
}
const istAktiv = c => { const b=berechne(c).typ; return b!=='beendet' && b!=='abgelaufen'; };
const jahresBeitrag = v => (+v.beitrag||0) * (ZW[v.zahlweise]||ZW.monatlich)[1];
function istBald(c){ const b=berechne(c); return b.typ==='termin' && tageBis(b.bis) <= settings.vorlauf; }

function fristText(c){
  const b = berechne(c);
  switch(b.typ){
    case 'termin': return {t:`Kündigen bis ${fmt(b.bis)} (${inTagen(tageBis(b.bis))}), endet dann zum ${fmt(b.termin)}`, soon: tageBis(b.bis)<=settings.vorlauf};
    case 'jederzeit': return {t:`Jederzeit kündbar, frühestens zum ${fmt(b.termin)}`};
    case 'endet': return {t:`Endet automatisch zum ${fmt(b.termin)}`};
    case 'gekuendigt': return {t:`Gekündigt, endet zum ${fmt(b.termin)}`};
    case 'beendet': return {t: b.termin ? `Beendet seit ${fmt(b.termin)}` : 'Beendet'};
    case 'abgelaufen': return {t:`Abgelaufen am ${fmt(b.termin)}`};
    default: return {t:'Laufzeitende fehlt, Kündigungstermin nicht berechenbar'};
  }
}

/* ---------- Speicher (PocketBase) ---------- */
const K_CACHE='vertraege-cache', K_QUEUE='vertraege-queue', K_SERVER='vertraege-server';
const SETTINGS_ID='einstellungen00';
let pb=null, pending=[], flushing=false, syncing=false, unsub=null, syncState='local';
const uid = () => { const a='abcdefghijklmnopqrstuvwxyz0123456789'; let s=''; const r=crypto.getRandomValues(new Uint8Array(15)); for(const b of r) s+=a[b%36]; return s; };
const ls = { get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
function saveCache(){ ls.set(K_CACHE,{settings,vertraege}); }
function setSync(s){ syncState=s; const n=document.getElementById('storeNote');
  const q=pending.length, w=q?` ${q} ${q===1?'Änderung wartet':'Änderungen warten'}.`:'';
  const t={ local:'Nicht mit dem Server verbunden. Daten liegen nur in diesem Browser.', login:'Anmeldung abgelaufen. Bitte neu anmelden.',
    syncing:'Gleiche ab …', ok:'', offline:'Offline.'+w, error:'Abgleich fehlgeschlagen.'+w, rules:'Der Server verweigert den Zugriff. API-Regeln der Collection „vertraege“ prüfen.' }[s] ?? '';
  n.innerHTML = t ? esc(t)+((s==='login'||s==='local')?' <button class="btn" id="btnLogin" style="margin-left:8px;padding:6px 12px">Anmelden</button>':(s==='error'||s==='offline')?' <button class="btn" id="btnSync" style="margin-left:8px;padding:6px 12px">Jetzt abgleichen</button>':'') : '';
  n.hidden=!t;
  const bl=document.getElementById('btnLogin'); if(bl) bl.onclick=loginDialog;
  const bs=document.getElementById('btnSync'); if(bs) bs.onclick=()=>{ flush().then(sync); };
}
function connect(url){
  pb = new PocketBase(url.replace(/\/+$/,''));
  pb.autoCancellation(false);
}
function write(id,data){
  saveCache();
  pending=pending.filter(p=>p.id!==id); pending.push({op:'put',id}); ls.set(K_QUEUE,pending);
  return flush();
}
function remove(id){
  saveCache();
  pending=pending.filter(p=>p.id!==id); pending.push({op:'del',id}); ls.set(K_QUEUE,pending);
  flush();
}
const docFor = id => id===SETTINGS_ID ? settings : vertraege.find(c=>c.id===id);
async function flush(){
  if(!pb || !pb.authStore.isValid || flushing) return;
  if(!navigator.onLine){ setSync('offline'); return; }
  flushing=true; setSync('syncing');
  try{
    while(pending.length){
      const job=pending[0], col=pb.collection('vertraege');
      if(job.op==='del'){ try{ await col.delete(job.id); }catch(e){ if(e.status!==404) throw e; } }
      else { const d=docFor(job.id);
        if(d){ const body={data:JSON.parse(JSON.stringify(d))};
          try{ await col.update(job.id, body); }catch(e){ if(e.status===404) await col.create({id:job.id, ...body}); else throw e; } } }
      pending.shift(); ls.set(K_QUEUE,pending);
    }
    setSync('ok');
  }catch(e){ handleError(e); }
  finally{ flushing=false; }
}
function handleError(e){
  if(e && e.status===401){ pb.authStore.clear(); setSync('login'); }
  else if(e && e.status===403) setSync('rules');
  else if(!navigator.onLine || (e && e.status===0)) setSync('offline');
  else setSync('error');
}
function applyRecord(r){
  if(r.id===SETTINGS_ID) settings={mitglieder:[],vorlauf:30,...(r.data||{})};
  else if(r.data && r.data.versionen){ const c={...r.data,id:r.id}; const i=vertraege.findIndex(x=>x.id===c.id); if(i<0) vertraege.push(c); else vertraege[i]=c; }
}
async function sync(){
  if(!pb || !pb.authStore.isValid || syncing) return;
  if(!navigator.onLine){ setSync('offline'); return; }
  syncing=true; setSync('syncing');
  try{
    const recs=await pb.collection('vertraege').getFullList({batch:500});
    const wait=new Set(pending.map(p=>p.id));
    const local=vertraege, localSettings=settings;
    vertraege=[];
    for(const r of recs){ if(wait.has(r.id)) continue; applyRecord(r); }
    for(const c of local) if(wait.has(c.id) && !pending.find(p=>p.id===c.id&&p.op==='del')) vertraege.push(c);
    if(wait.has(SETTINGS_ID)) settings=localSettings;
    saveCache(); render(); setSync('ok');
    if(pending.length) await flush();
    subscribe();
  }catch(e){ handleError(e); }
  finally{ syncing=false; }
}
async function subscribe(){
  if(!pb || unsub) return;
  try{
    unsub = await pb.collection('vertraege').subscribe('*', e=>{
      if(pending.some(p=>p.id===e.record.id)) return;
      if(e.action==='delete') vertraege=vertraege.filter(x=>x.id!==e.record.id);
      else applyRecord(e.record);
      saveCache(); render();
    });
  }catch(e){}
}
async function login(url,mail,pw){
  connect(url);
  await pb.collection('users').authWithPassword(mail,pw);
  ls.set(K_SERVER,{url});
  const firstData = vertraege.length && !ls.get('vertraege-synced',false);
  if(firstData){ for(const c of vertraege) pending.push({op:'put',id:c.id}); pending.push({op:'put',id:SETTINGS_ID}); ls.set(K_QUEUE,pending); }
  ls.set('vertraege-synced',true);
  await flush(); await sync();
}
async function logout(){
  if(unsub){ try{ await unsub(); }catch(e){} unsub=null; }
  if(pb) pb.authStore.clear();
  ls.set(K_SERVER,null); pb=null; setSync('local');
}
function loginDialog(){
  const srv=ls.get(K_SERVER,null);
  open('Mit dem Server verbinden', `<form id="f">
    <label>Serveradresse<input name="url" type="url" required autocapitalize="off" value="${esc(srv?.url || (location.origin.startsWith('http')?location.origin:''))}" placeholder="https://"></label>
    <label>E-Mail<input name="mail" type="email" required autocomplete="username"></label>
    <label>Passwort<input name="pw" type="password" required autocomplete="current-password"></label>
    <p class="hint" id="loginErr" hidden></p>
    <div class="actions"><button class="btn primary" type="submit">Anmelden</button><button class="btn" type="button" data-close>Später</button></div></form>`);
  const f=document.getElementById('f');
  f.onsubmit=async e=>{ e.preventDefault(); const err=document.getElementById('loginErr'); err.hidden=true;
    const b=f.querySelector('[type=submit]'); b.disabled=true; b.textContent='Melde an …';
    try{ await login(f.elements.url.value.trim(), f.elements.mail.value.trim(), f.elements.pw.value); dlg.close(); }
    catch(x){ err.hidden=false; err.style.color='var(--warn)';
      err.textContent = x && x.status===400 ? 'E-Mail oder Passwort stimmt nicht.' : 'Der Server ist nicht erreichbar. Prüf die Adresse und deine Internetverbindung.';
      b.disabled=false; b.textContent='Anmelden'; } };
}
function init(){
  const c=ls.get(K_CACHE,null); if(c){ settings=c.settings||settings; vertraege=c.vertraege||[]; }
  pending=ls.get(K_QUEUE,[]);
  render();
  const srv=ls.get(K_SERVER,null);
  if(srv && srv.url && window.PocketBase){ connect(srv.url); if(pb.authStore.isValid){ setSync('syncing'); flush().then(sync); } else setSync('login'); }
  else { setSync('local'); if(window.PocketBase) loginDialog(); }
  window.addEventListener('online',()=>{ flush().then(sync); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') flush().then(sync); });
}
function exportJson(){
  const blob=new Blob([JSON.stringify({format:'vertraege-1',exportiert:iso(heute()),settings,vertraege},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`vertraege-${iso(heute())}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function importJson(file){
  try{
    const d=JSON.parse(await file.text());
    if(!d || !Array.isArray(d.vertraege)) throw 0;
    if(!confirm(`${d.vertraege.length} Verträge importieren? Vorhandene Verträge mit gleicher Kennung werden überschrieben.`)) return;
    if(d.settings){ settings={mitglieder:[],vorlauf:30,...d.settings}; pending=pending.filter(p=>p.id!==SETTINGS_ID); pending.push({op:'put',id:SETTINGS_ID}); }
    for(const c0 of d.vertraege){ const c={...c0}; if(!/^[a-z0-9]{15}$/.test(c.id||'')) c.id=uid();
      const i=vertraege.findIndex(x=>x.id===c.id); if(i<0) vertraege.push(c); else vertraege[i]=c;
      pending=pending.filter(p=>p.id!==c.id); pending.push({op:'put',id:c.id}); }
    ls.set(K_QUEUE,pending); saveCache(); render(); dlg.close(); flush();
  }catch(e){ alert('Die Datei ist keine gültige Sicherung der Vertrags-App.'); }
}
function showNote(){}

/* ---------- Rendering ---------- */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mName = id => (settings.mitglieder.find(m=>m.id===id)||{}).name || '';

function fitHero(){
  const el=document.querySelector('#hero .name'); if(!el || el.style.whiteSpace==='normal') return;
  let size=40; el.style.fontSize=size+'px';
  while(el.scrollWidth>el.clientWidth && size>20){ size--; el.style.fontSize=size+'px'; }
  if(el.scrollWidth>el.clientWidth){ el.style.whiteSpace='normal'; el.style.overflowWrap='anywhere'; }
}
window.addEventListener('resize',()=>fitHero());
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>fitHero());
function render(){
  const aktiv = vertraege.filter(istAktiv);
  // Hero
  const hero=document.getElementById('hero');
  const naechste = aktiv.map(c=>({c,b:berechne(c)})).filter(x=>x.b.typ==='termin').sort((a,b)=>a.b.bis-b.b.bis)[0];
  if(!vertraege.length){
    hero.className='hero';
    hero.innerHTML=`<h1><span class="name" style="white-space:normal">Alle Verträge an einem Ort.</span></h1><p class="when">Leg deinen ersten Vertrag an, die Kündigungstermine rechnet die App selbst.</p>`;
  } else if(naechste){
    const n=tageBis(naechste.b.bis);
    hero.className='hero'+(n<=settings.vorlauf?' urgent':'');
    hero.innerHTML=`<p class="lead">Nächste Kündigungsfrist</p><h1><span class="name">${esc(naechste.c.gegenstand)}</span></h1><p class="when">bis ${fmt(naechste.b.bis)}, ${inTagen(n)}</p>`;
  } else {
    hero.className='hero';
    hero.innerHTML=`<p class="lead">Nächste Kündigungsfrist</p><h1><span class="name">Keine Frist in Sicht.</span></h1>`;
  }
  fitHero();
  // Summen
  const sum=document.getElementById('sum');
  const jahr = aktiv.reduce((s,c)=>s+jahresBeitrag(aktuell(c)),0);
  const bald = aktiv.filter(istBald).length;
  sum.hidden=!vertraege.length;
  sum.innerHTML=`<div><strong>${EUR.format(jahr/12)}</strong>pro Monat</div><div><strong>${EUR.format(jahr)}</strong>pro Jahr</div><div><strong>${aktiv.length}</strong>aktive Verträge</div>${bald?`<div><strong style="color:var(--warn)">${bald}</strong>bald kündbar</div>`:''}`;
  // Filter
  const kats=[...new Set(vertraege.map(c=>c.kategorie))];
  const opts=[['alle','Alle'],['bald','Bald kündbar'],...KAT.filter(k=>kats.includes(k.k)).map(k=>[k.k,k.n]),['inaktiv','Beendet']];
  document.getElementById('filters').innerHTML = vertraege.length ? opts.map(([k,n])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${esc(n)}</button>`).join('') : '';
  document.getElementById('search').hidden = vertraege.length < 4;
  // Liste
  const q=suche.trim().toLowerCase();
  let rows = vertraege.filter(c=>{
    if(filter==='inaktiv') { if(istAktiv(c)) return false; }
    else { if(!istAktiv(c)) return false;
      if(filter==='bald' && !istBald(c)) return false;
      if(filter!=='alle' && filter!=='bald' && c.kategorie!==filter) return false; }
    if(q){ const v=aktuell(c); const hay=[c.gegenstand,c.partner,v.tarif,c.nummer,c.kundennummer,c.objekt].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const key = c => { const b=berechne(c); return b.bis ? +b.bis : b.termin ? +b.termin + 1e13 : 9e15; };
  rows.sort((a,b)=>key(a)-key(b));
  const list=document.getElementById('list');
  if(!vertraege.length){ list.innerHTML=''; return; }
  if(!rows.length){ list.innerHTML=`<div class="empty"><p>Keine Verträge in dieser Ansicht.</p></div>`; return; }
  list.innerHTML = rows.map(c=>{
    const v=aktuell(c), f=fristText(c), zw=(ZW[v.zahlweise]||ZW.monatlich)[0];
    const sub=[c.partner, v.tarif].filter(Boolean).map(esc).join(', ');
    return `<button class="card${istAktiv(c)?'':' inactive'}" data-id="${esc(c.id)}" style="--cat:${katColor(c.kategorie)}">
      <span class="tab">${esc(katName(c.kategorie))}</span>
      <h3>${esc(c.gegenstand)}</h3>
      <div class="row2"><p class="sub">${sub}</p><span class="amount">${EUR.format(+v.beitrag||0)}<small>${zw}</small></span></div>
      <p class="due ${f.soon?'soon':'calm'}">${esc(f.t)}</p>
    </button>`;
  }).join('');
}

/* ---------- Dialoge ---------- */
const dlg=document.getElementById('dlg'), sheet=document.getElementById('sheet');
function open(title, body){
  sheet.innerHTML=`<div class="sheet-head"><h2>${esc(title)}</h2><button class="close" data-close aria-label="Schließen">×</button></div><div class="sheet-body">${body}</div>`;
  if(!dlg.open) dlg.showModal();
  sheet.querySelector('.sheet-body').scrollTop=0;
}
dlg.addEventListener('click',e=>{ if(e.target===dlg || e.target.closest('[data-close]')) dlg.close(); });

function versionFields(v){
  v=v||{};
  const sel=(name,opts,val)=>`<select name="${name}">${opts.map(([k,n])=>`<option value="${k}"${k===val?' selected':''}>${n}</option>`).join('')}</select>`;
  return `
  <label>Tarif<input name="tarif" value="${esc(v.tarif)}"></label>
  <div class="grid2">
    <label>Beginn<input type="date" name="beginn" value="${esc(v.beginn)}"></label>
    <label>Ende der Laufzeit<input type="date" name="ende" value="${esc(v.ende)}"></label>
  </div>
  <div class="grid2">
    <label>Beitrag in €<input name="beitrag" inputmode="decimal" value="${v.beitrag!=null&&v.beitrag!==''?String(v.beitrag).replace('.',','):''}"></label>
    <label>Zahlweise${sel('zahlweise',Object.entries(ZW).map(([k,x])=>[k,x[0]]),v.zahlweise||'monatlich')}</label>
  </div>
  <div class="grid2">
    <label>Kündigungsfrist<input name="fristWert" type="number" min="0" value="${esc(v.fristWert??3)}"></label>
    <label>Einheit${sel('fristEinheit',[['monate','Monate'],['wochen','Wochen'],['tage','Tage']],v.fristEinheit||'monate')}</label>
  </div>
  <label>Kündbar${sel('fristModus',[['ablauf','zum Ende der Laufzeit'],['jederzeit','jederzeit nach Laufzeitende'],['monatsende','zum Monatsende nach Laufzeitende']],v.fristModus||'ablauf')}</label>
  <div class="grid2">
    <label>Verlängert sich um<input name="verlWert" type="number" min="0" value="${esc(v.verlWert??1)}"></label>
    <label>Einheit${sel('verlEinheit',[['jahre','Jahre'],['monate','Monate'],['keine','endet automatisch']],v.verlEinheit||'jahre')}</label>
  </div>
  <div class="energie">
    <div class="grid2">
      <label>Arbeitspreis ct/kWh<input name="kwh" inputmode="decimal" value="${esc(v.kwh)}"></label>
      <label>Grundpreis €/Monat<input name="grundpreis" inputmode="decimal" value="${esc(v.grundpreis)}"></label>
    </div>
  </div>
  <label>Notiz zu diesem Stand<textarea name="vnotiz" placeholder="z. B. Beitragserhöhung, Sonderkündigungsrecht bis …">${esc(v.notiz)}</textarea></label>`;
}
function readVersion(form){
  const g=n=>form.elements[n]?.value?.trim() ?? '';
  const num=s=>{ s=String(s); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const x=parseFloat(s); return isNaN(x)?'':x; };
  const numDec=s=>{ const x=parseFloat(String(s).replace(',','.')); return isNaN(x)?'':x; };
  return { vid:'s'+Date.now().toString(36), tarif:g('tarif'), beginn:g('beginn'), ende:g('ende'),
    beitrag: num(g('beitrag')), zahlweise:g('zahlweise'), fristWert:+g('fristWert')||0, fristEinheit:g('fristEinheit'),
    fristModus:g('fristModus'), verlWert:+g('verlWert')||0, verlEinheit:g('verlEinheit'),
    kwh:numDec(g('kwh')), grundpreis:numDec(g('grundpreis')), notiz:g('vnotiz'), erfasst:iso(heute()) };
}
function toggleEnergie(form){
  const e=form.querySelector('.energie'); if(!e) return;
  const k=form.elements.kategorie ? form.elements.kategorie.value : form.dataset.kat;
  e.hidden = k!=='energie';
}

function vertragForm(c){
  const neu=!c; c=c||{kategorie:'versicherung',betrifft:[],versionen:[{}]};
  const v=aktuell(c);
  const ms=settings.mitglieder;
  const memberHtml = ms.length
    ? `<div class="members">${ms.map(m=>`<label><input type="checkbox" name="betrifft" value="${esc(m.id)}"${(c.betrifft||[]).includes(m.id)?' checked':''}>${esc(m.name)}</label>`).join('')}</div>`
    : `<p class="hint">Lege in den Einstellungen deine Haushaltsmitglieder an, dann kannst du sie hier auswählen.</p>`;
  open(neu?'Neuer Vertrag':'Vertrag bearbeiten', `<form id="f">
    <fieldset><legend>Vertrag</legend>
      <label>Vertragsgegenstand<input name="gegenstand" required value="${esc(c.gegenstand)}" placeholder="z. B. Hausratversicherung"></label>
      <label>Kategorie<select name="kategorie">${KAT.map(k=>`<option value="${k.k}"${k.k===c.kategorie?' selected':''}>${k.n}</option>`).join('')}</select></label>
      <label>Versicherung / Anbieter<input name="partner" value="${esc(c.partner)}"></label>
      <div class="grid2"><label>Vertragsnummer<input name="nummer" value="${esc(c.nummer)}"></label><label>Kundennummer<input name="kundennummer" value="${esc(c.kundennummer)}"></label></div>
      <label>Link zum Dokument in Paperless<input name="paperless" type="url" value="${esc(c.paperless)}" placeholder="https://"></label>
      ${ms.length?`<label>Vertragsinhaber<select name="inhaber"><option value="">–</option>${ms.map(m=>`<option value="${esc(m.id)}"${m.id===c.inhaber?' selected':''}>${esc(m.name)}</option>`).join('')}</select></label>`:''}
      <label style="margin-bottom:4px">Versichert bzw. betrifft</label>${memberHtml}
      <label>oder Gegenstand<input name="objekt" value="${esc(c.objekt)}" placeholder="z. B. VW Golf, Fahrrad, Wohnung"></label>
      <label>Notizen<textarea name="notizen">${esc(c.notizen)}</textarea></label>
    </fieldset>
    <fieldset><legend>${neu?'Konditionen':'Aktueller Vertragsstand'}</legend>${versionFields(neu?null:v)}</fieldset>
    <div class="actions"><button class="btn primary" type="submit">Speichern</button><button class="btn" type="button" data-close>Abbrechen</button></div>
  </form>`);
  const f=document.getElementById('f');
  toggleEnergie(f); f.elements.kategorie.addEventListener('change',()=>toggleEnergie(f));
  f.addEventListener('submit',e=>{
    e.preventDefault();
    const g=n=>f.elements[n]?.value?.trim()||'';
    const nv=readVersion(f);
    const data={ ...(neu?{id:uid(), status:'aktiv'}:c),
      gegenstand:g('gegenstand'), kategorie:g('kategorie'), partner:g('partner'), nummer:g('nummer'), kundennummer:g('kundennummer'), paperless:g('paperless'),
      inhaber:g('inhaber'), objekt:g('objekt'), notizen:g('notizen'),
      betrifft:[...f.querySelectorAll('input[name=betrifft]:checked')].map(x=>x.value) };
    if(neu) data.versionen=[nv];
    else { nv.vid=v.vid||nv.vid; nv.erfasst=v.erfasst||nv.erfasst; data.versionen=[...c.versionen.slice(0,-1), nv]; }
    upsert(data); dlg.close(); if(!neu) detail(data.id);
  });
}

function neuerStand(c){
  const v=aktuell(c), vm=verlMonate(v), t=heute();
  let e=parse(v.ende), pre={...v, notiz:''};
  if(e && vm){
    let k=0; while(addMonths(parse(v.ende),(k+1)*vm) < t && k<1000) k++;
    e = k? addMonths(parse(v.ende),k*vm) : e;
    pre.beginn=iso(addDays(e,1)); pre.ende=iso(addMonths(parse(v.ende),(k+1)*vm));
  }
  open('Neuer Vertragsstand', `<p class="hint" style="margin:0 0 16px">Übernimmt die bisherigen Werte. Passe an, was sich geändert hat, der alte Stand bleibt in der Historie.</p>
  <form id="f" data-kat="${esc(c.kategorie)}">${versionFields(pre)}
  <div class="actions"><button class="btn primary" type="submit">Stand speichern</button><button class="btn" type="button" data-back>Zurück</button></div></form>`);
  const f=document.getElementById('f'); toggleEnergie(f);
  f.querySelector('[data-back]').onclick=()=>detail(c.id);
  f.addEventListener('submit',e=>{ e.preventDefault(); const data={...c, versionen:[...c.versionen, readVersion(f)]}; upsert(data); detail(c.id); });
}

function kuendigen(c){
  const b=berechne(c);
  const zum = b.termin ? iso(b.termin) : '';
  open('Als gekündigt markieren', `<form id="f">
    <label>Gekündigt am<input type="date" name="am" value="${iso(heute())}"></label>
    <label>Endet zum<input type="date" name="zum" value="${zum}" required></label>
    <div class="actions"><button class="btn primary" type="submit">Als gekündigt speichern</button><button class="btn" type="button" data-back>Zurück</button></div></form>`);
  const f=document.getElementById('f');
  f.querySelector('[data-back]').onclick=()=>detail(c.id);
  f.addEventListener('submit',e=>{ e.preventDefault(); upsert({...c, status:'gekuendigt', gekuendigtAm:f.elements.am.value, gekuendigtZum:f.elements.zum.value}); detail(c.id); });
}

function detail(id){
  const c=vertraege.find(x=>x.id===id); if(!c){ dlg.close(); return; }
  const v=aktuell(c), f=fristText(c), b=berechne(c);
  const betrifft=[...(c.betrifft||[]).map(mName).filter(Boolean), c.objekt].filter(Boolean).join(', ');
  const row=(k,val)=>val?`<dt>${k}</dt><dd>${val}</dd>`:'';
  const zw=(ZW[v.zahlweise]||ZW.monatlich)[0];
  const fristLabel = v.fristWert ? `${v.fristWert} ${({monate:'Monate',wochen:'Wochen',tage:'Tage'})[v.fristEinheit]||''} ${({ablauf:'zum Laufzeitende',jederzeit:'jederzeit nach Laufzeitende',monatsende:'zum Monatsende nach Laufzeitende'})[v.fristModus]||''}` : 'keine';
  const verl = v.verlEinheit==='keine' ? 'endet automatisch' : `um ${v.verlWert} ${v.verlEinheit==='jahre'?(v.verlWert==1?'Jahr':'Jahre'):(v.verlWert==1?'Monat':'Monate')}`;
  const hist = [...c.versionen].map((x,i,arr)=>{
    const prev=arr[i-1]; let diff='';
    if(prev){ const a=jahresBeitrag(prev), n=jahresBeitrag(x); if(a>0 && a!==n){ const p=(n-a)/a*100; diff=` <span class="${p>0?'up':'downv'}">${p>0?'+':''}${p.toFixed(1).replace('.',',')} %</span>`; } }
    return `<li class="${i===arr.length-1?'current':''}"><div class="period">${fmt(parse(x.beginn))} bis ${fmt(parse(x.ende))}</div>
      <div class="meta">${esc(x.tarif||'ohne Tarifangabe')}, ${EUR.format(+x.beitrag||0)} ${(ZW[x.zahlweise]||ZW.monatlich)[0]}${diff}</div>
      ${x.kwh!==''&&x.kwh!=null?`<div class="meta">${String(x.kwh).replace('.',',')} ct/kWh, Grundpreis ${EUR.format(+x.grundpreis||0)} im Monat</div>`:''}
      ${x.notiz?`<div class="meta">${esc(x.notiz)}</div>`:''}</li>`;
  }).reverse().join('');
  const aktiv = c.status!=='gekuendigt' && c.status!=='beendet';
  open(c.gegenstand, `
    <div class="status-box${f.soon?' soon':''}"><strong>${esc(f.t)}</strong></div>
    <dl>
      ${row('Kategorie',esc(katName(c.kategorie)))}
      ${row('Anbieter',esc(c.partner))}
      ${row('Tarif',esc(v.tarif))}
      ${row('Vertragsnummer',esc(c.nummer))}
      ${row('Kundennummer',esc(c.kundennummer))}
      ${row('Inhaber',esc(mName(c.inhaber)))}
      ${row('Betrifft',esc(betrifft))}
      ${row('Beitrag',`${EUR.format(+v.beitrag||0)} ${zw}, ${EUR.format(jahresBeitrag(v))} im Jahr`)}
      ${row('Laufzeit',`${fmt(parse(v.beginn))} bis ${fmt(parse(v.ende))}`)}
      ${row('Verlängerung',verl)}
      ${row('Kündigungsfrist',esc(fristLabel))}
      ${c.status==='gekuendigt'?row('Gekündigt am',fmt(parse(c.gekuendigtAm))):''}
      ${c.paperless?row('Dokument',`<a href="${esc(c.paperless)}" target="_blank" rel="noopener">In Paperless öffnen</a>`):''}
      ${row('Notizen',esc(c.notizen))}
    </dl>
    <div class="actions" style="margin-bottom:24px">
      ${aktiv?`<button class="btn primary" data-a="stand">Neuer Vertragsstand</button>`:''}
      <button class="btn" data-a="edit">Bearbeiten</button>
      ${aktiv?`<button class="btn" data-a="kuend">Als gekündigt markieren</button>`:`<button class="btn" data-a="reakt">Wieder aktivieren</button>`}
    </div>
    <h3 style="margin-bottom:12px">Historie</h3>
    <ul class="history">${hist}</ul>
    <button class="btn danger" data-a="del">Vertrag löschen</button>`);
  sheet.querySelectorAll('[data-a]').forEach(btn=>btn.onclick=()=>{
    const a=btn.dataset.a;
    if(a==='stand') neuerStand(c);
    if(a==='edit') vertragForm(c);
    if(a==='kuend') kuendigen(c);
    if(a==='reakt'){ const d={...c,status:'aktiv'}; delete d.gekuendigtAm; delete d.gekuendigtZum; upsert(d); detail(c.id); }
    if(a==='del' && confirm(`„${c.gegenstand}“ mit der ganzen Historie löschen?`)){ vertraege=vertraege.filter(x=>x.id!==c.id); remove(c.id); dlg.close(); render(); }
  });
}

function einstellungen(){
  const draw=()=>{
    open('Einstellungen', `
      <fieldset><legend>Haushaltsmitglieder</legend>
        ${settings.mitglieder.map(m=>`<div class="settings-member"><span>${esc(m.name)}</span><button class="btn danger" data-del="${esc(m.id)}">Entfernen</button></div>`).join('') || '<p class="hint" style="margin:0 0 10px">Noch niemand angelegt.</p>'}
        <form class="inline" id="fm" style="margin-top:12px"><input name="n" placeholder="Name" aria-label="Name"><button class="btn" type="submit">Hinzufügen</button></form>
      </fieldset>
      <fieldset><legend>Erinnerung</legend>
        <label>Als „bald kündbar“ markieren, wenn die Frist in weniger als so vielen Tagen abläuft<input type="number" min="1" id="vorlauf" value="${settings.vorlauf}"></label>
      </fieldset>
      <fieldset><legend>Server</legend>
        ${pb && pb.authStore.isValid ? `<p class="hint" style="margin:0 0 10px">Angemeldet als ${esc(pb.authStore.record?.email || pb.authStore.model?.email || '')} bei ${esc(pb.baseURL||pb.baseUrl||'')}</p><button class="btn" id="btnLogout">Abmelden</button>` : `<button class="btn" id="btnLogin2">Mit dem Server verbinden</button>`}
      </fieldset>
      <fieldset><legend>Sicherung</legend>
        <div class="actions"><button class="btn" id="btnExport">Als Datei sichern</button><label class="btn" style="margin:0;color:var(--ink)">Sicherung einspielen<input type="file" id="importFile" accept="application/json,.json" hidden></label></div>
      </fieldset>`);
    const lo=document.getElementById('btnLogout'); if(lo) lo.onclick=async()=>{ if(pending.length && !confirm(`${pending.length} Änderungen sind noch nicht auf dem Server. Trotzdem abmelden?`)) return; await logout(); dlg.close(); };
    const li=document.getElementById('btnLogin2'); if(li) li.onclick=loginDialog;
    document.getElementById('btnExport').onclick=exportJson;
    document.getElementById('importFile').onchange=e=>{ const f=e.target.files[0]; if(f) importJson(f); };
    document.getElementById('fm').onsubmit=e=>{ e.preventDefault(); const n=e.target.elements.n.value.trim(); if(!n) return;
      settings={...settings, mitglieder:[...settings.mitglieder,{id:'m'+Date.now().toString(36), name:n}]}; saveSettings(); draw(); };
    sheet.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ settings={...settings, mitglieder:settings.mitglieder.filter(m=>m.id!==b.dataset.del)}; saveSettings(); draw(); });
    document.getElementById('vorlauf').onchange=e=>{ settings={...settings, vorlauf:Math.max(1,+e.target.value||30)}; saveSettings(); };
  };
  draw();
}
function saveSettings(){ write(SETTINGS_ID, settings); render(); }
function upsert(c){ const i=vertraege.findIndex(x=>x.id===c.id); if(i<0) vertraege.push(c); else vertraege[i]=c; write(c.id,c); render(); }

/* ---------- Events ---------- */
document.getElementById('btnNew').onclick=()=>vertragForm(null);
document.getElementById('btnSettings').onclick=einstellungen;
document.getElementById('filters').onclick=e=>{ const b=e.target.closest('[data-f]'); if(b){ filter=b.dataset.f; render(); } };
document.getElementById('list').onclick=e=>{ const b=e.target.closest('[data-id]'); if(b) detail(b.dataset.id); };
document.getElementById('search').oninput=e=>{ suche=e.target.value; render(); };

render();
init();
})();
</script>
</body>
</html>
